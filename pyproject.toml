[project]
name = "python-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Erik-Toller_wsp", email = "erik.toller@wsp.com" }
]
requires-python = ">=3.11"
dependencies = [
    "gwrefpy>=0.4.1",
    "jupyterlab>=4.6.3",
    "pastas>=2.0.0",
    "sgu-client>=0.4.3",
]

[project.scripts]
python-course = "python_course:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "myst-nb>=1.4.0",
    "sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
    "sphinx-rtd-theme>=3.1.0",
]
